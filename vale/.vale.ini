# Vale (vale.sh) configuration for technical writing.
#
# This is the *default* style, used when a project has no .vale.ini of its own.
# Vale discovery order (from the file's working directory upward) lets any
# project override these rules by committing its own `.vale.ini` / `.vale/`
# styles — e.g. to enforce project voice ("FreeIPA", fqdn hostnames, ...).
#
# Referenced by `VALE_CONFIG_PATH` (see lua/config/options.lua).
# After editing `Packages`, re-fetch bundled styles with:
#   vale --config <this dir>/vale/.vale.ini --sync

StylesPath = styles
MinAlertLevel = suggestion
# https://vale.sh/supported-package-managers/
Packages = Microsoft, Google, write-good

# Vale scans Markdown/YAML/AsciiDoc by default; `CodeContext` adds convention
# (e.g. STYLE.md) files. Keep code-comment spelling to the `typos` linter instead.
[*]
BasedOnStyles = Microsoft, Google, write-good